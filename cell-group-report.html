<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cell Group Report</title>

  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #e5e5e5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .a4-page {
      width: 210mm;
      height: 297mm;
      margin: 10mm auto;
      padding: 7mm;
      background: #ffffff;

      display: flex;
      flex-direction: column;
      gap: 6mm;

      overflow: hidden;
    }

    .report-form {
      width: 100%;
      height: calc((100% - 6mm) / 2);

      border: 1px solid #000000;
      background: #ffffff;

      position: relative;
      overflow: hidden;
    }

    .landscape-content {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
    }

    .placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      font-weight: bold;
      color: #777777;
      letter-spacing: 1px;
    }
.report-header {
  width: 100%;
  padding: 3mm 4mm 2mm;
  text-align: center;
  border-bottom: 1px solid #000000;
}

.ministry-name {
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 0.3px;
}

.report-year {
  font-size: 9px;
  margin-top: 0.5mm;
}

.report-title {
  font-size: 14px;
  font-weight: bold;
  margin-top: 1mm;
  letter-spacing: 0.8px;
}

.header-details {
  display: grid;
  grid-template-columns: 1.4fr 1.4fr 0.7fr;
  gap: 4mm;
  margin-top: 3mm;
  text-align: left;
}

.header-details > div {
  font-size: 7px;
  font-weight: bold;
}

.header-details .line {
  height: 4mm;
  border-bottom: 1px solid #000000;
  margin-top: 1mm;
}
    @media print {
      html,
      body {
        background: #ffffff;
      }

      .a4-page {
        margin: 0;
        padding: 7mm;
      }
    }
  </style>
</head>

<body>

  <main class="a4-page">

    <!-- CELL GROUP REPORT #1 -->
    <section class="report-form">
      <div class="landscape-content">
       <div class="report-header">

  <div class="ministry-name">
    JOSHUA GENERATION WORLDWIDE MINISTRIES, INC.
  </div>

  <div class="report-year">
    2019
  </div>

  <div class="report-title">
    CELL GROUP REPORT
  </div>

  <div class="header-details">
    <div>
      <span>CELL GROUP LEADER</span>
      <div class="line"></div>
    </div>

    <div>
      <span>LOCAL CHURCH</span>
      <div class="line"></div>
    </div>

    <div>
      <span>MONTH</span>
      <div class="line"></div>
    </div>
  </div>

</div>
      </div>
    </section>


    <!-- CELL GROUP REPORT #2 -->
    <section class="report-form">
      <div class="landscape-content">
        <div class="placeholder">
          CELL GROUP REPORT — FORM 2
        </div>
      </div>
    </section>

  </main>

</body>
</html>
